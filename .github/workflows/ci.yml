name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: knowledgeos
          POSTGRES_PASSWORD: knowledgeos_ci
          POSTGRES_DB: knowledgeos
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U knowledgeos'
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://knowledgeos:knowledgeos_ci@localhost:5432/knowledgeos
      - run: pytest -q
        working-directory: backend
        env:
          TEST_QDRANT_URL: http://localhost:6333
          TEST_DATABASE_URL: postgresql+psycopg://knowledgeos:knowledgeos_ci@localhost:5432/knowledgeos
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
